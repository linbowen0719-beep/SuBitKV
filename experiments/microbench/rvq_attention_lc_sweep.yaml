schema_version: 1
name: rvq_attention_lc_storage_sweep
seed: 42
device: cuda
dtype: bf16
output_root: results/rvq_attention_lc_sweep

data:
  path: /data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/kv_dump/test/0/layer_10.pt
  tensor_keys: {q: Q, k: K, v: V}
  layer: 10
  prompt_id: 0
  tokens_per_frame: 880
  q_start_frame: -1
  q_tokens: 880
  kv_tokens: [880, 3520, 7040]
  representation_assumption: pre_rope_dump_treated_as_post_rope_attention_input

benchmark:
  warmup: 10
  repeat: 30
  fixed_attention_reuse: 4
  fixed_attention_reuse_provenance: generate.py_few_step_true_reuses_each_fixed_cache_state_for_four_attention_calls
  full_compression_span_lifetime_reuse: [80, 76, 72, 68, 64, 60, 56, 52, 48, 44, 40, 36, 32, 28, 24, 20, 16, 12, 8, 4]
  full_compression_mean_lifetime_reuse: 42
  fused_uint4_scale_max_k: 1760
  encode_batch_size: 2048
  encode_span_tokens: 3520
  scale_storage_dtype: uint4
  codebook_storage_dtypes: [bf16, int4]
  histogram: {enabled: true, max_bins: 512, block_q: 32, block_k: 32, num_warps: 4, num_stages: 1}
  tile_decode: {block_q: 64, block_k: 16, num_warps: 4, num_stages: 1}

# These are standard full-dimensional, RMS-normalized RVQ codebooks with
# matching layer-10 K/V files for all 24 heads.  The diag variants form a
# controlled L/C grid trained by one pipeline; MovieGen/21chunk variants anchor
# the result to the project's primary configurations.  Reconstruction is
# always remeasured on the same current Q/K/V dump.
comparison_axes:
  fixed_l_1: [diag_l1c64, diag_l1c128, diag_l1c256, diag_l1c512, diag_l1c1024]
  fixed_lc_512: [diag_l1c512, diag_l2c256, diag_l4c128, diag_l8c64]
  fixed_c_256: [diag_l1c256, diag_l2c256, diag_l3c256, diag_l4c256, diag_l5c256, diag_l6c256]
  equal_index_bits_18: [diag_l2c512, diag_l3c64]
  equal_index_bits_24: [diag_l3c256, diag_l4c64]
  equal_index_bits_40: [diag_l4c1024, diag_l5c256]
  equal_index_bits_48: [diag_l6c256, diag_l8c64]
variants:
  - name: diag_l1c64
    levels: 1
    centroids: 64
    k_dir: /data/bowen/rvq_diag/sweep_k_l1c64_codebooks
    v_dir: /data/bowen/rvq_diag/sweep_v_l1c64_codebooks
  - name: diag_l1c128
    levels: 1
    centroids: 128
    k_dir: /data/bowen/rvq_diag/sweep_k_l1c128_codebooks
    v_dir: /data/bowen/rvq_diag/sweep_v_l1c128_codebooks
