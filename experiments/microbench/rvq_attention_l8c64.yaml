schema_version: 1
name: rvq_attention_l8c64
seed: 42
device: cuda
dtype: bf16
output_root: results/rvq_attention_microbench

data:
  tracks:
    - name: real_thnd
      enabled: true
      format: thnd
      path: /data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/kv_dump/test/0/layer_10.pt
      tensor_keys: {q: Q, k: K, v: V}
      layer: 10
      split: test
      prompt_id: 0
      q_start_frame: -1  # End-relative: select the final 1-frame/4-frame Q window.
      kv_start_token: 0
      tokens_per_frame: 880
      # This dump is labelled pre-RoPE/pre-PRoPE.  The microbenchmark treats
      # the values as the post-position representations in the task's stated
      # positional-embedding abstraction; the provenance remains in outputs.
      representation_assumption: pre_rope_dump_treated_as_post_rope_attention_input
    - name: post_rope_sample
      enabled: true
      format: bhsd_sample
      path: results/attention_diag_qkv_smoke/rank_000/layer_10/call_00000.pt
      tensor_keys: {q: query, k: key, v: value}
      layer: 10
      sample_half: 0
      q_token_counts: [64]
      kv_tokens: [3520]
      representation_assumption: actual_tensor_passed_to_sdpa

codebooks:
  k_dir: /data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/sweep_k_l8c64_codebooks
  v_dir: /data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/sweep_v_l8c64_codebooks
  expected_levels: 8
  expected_centroids: 64
  compute_dtype: bf16
  storage_dtype: int4
  scale_storage_dtype: uint4
  encode_batch_size: 2048
  # INT4 remains the resident storage label.  Kernels consume a persistent
  # BF16 materialization; cold INT4 unpack/materialization is timed separately.
  runtime_strategy: persistent_bf16_materialization_from_int4_residency

benchmark:
  warmup: 10
  repeat: 50
  # Fusing uint4 scale unpack avoids two launches at short K, but repeats the
  # bit unpack in every Q CTA.  Above this measured crossover, unpack once.
  fused_uint4_scale_max_k: 1760
  materialized_max_qk_elements: 200000000
  require_cuda: true
  profiles:
    default:
      tracks: [real_thnd]
      q_frame_counts: [1]
      kv_tokens: [880, 1760, 3520, 7040]
    long:
      tracks: [real_thnd]
      q_frame_counts: [1]
      kv_tokens: [880, 1760, 3520, 7040, 14080, 28160, 42240, 70400, 73920]
    production:
      tracks: [real_thnd]
      q_frame_counts: [4]
      # Exact 20-span schedule: one 4-frame span is 4*880=3520 tokens.
      kv_tokens: [3520, 7040, 10560, 14080, 17600, 21120, 24640, 28160, 31680, 35200, 38720, 42240, 45760, 49280, 52800, 56320, 59840, 63360, 66880, 70400]
    supplement:
      tracks: [post_rope_sample]
      q_frame_counts: [1]
      kv_tokens: [3520]
  histogram:
    block_q: 32
    block_k: 16
    num_warps: 4
    num_stages: 1
  tile_decode:
    block_q: 64
    block_k: 16
    num_warps: 4
    num_stages: 1

reuse:
  fixed_attention_reuse: 4
  provenance: generate.py few_step=True uses each fixed cache state for four attention calls; num_inference_steps=50 is original run metadata, not this reuse count
  original_run_metadata:
    num_chunks: 21
    num_inference_steps: 50
    few_step: true
    tokens_per_frame: 880
    frames_per_span: 4
  full_compression_span_lifetime_reuse: [80, 76, 72, 68, 64, 60, 56, 52, 48, 44, 40, 36, 32, 28, 24, 20, 16, 12, 8, 4]
  full_compression_mean_lifetime_reuse: 42
  first_nearest_middle_span_lifetime_reuse: [72, 68, 64, 60, 56, 52, 48, 44, 40, 36, 32, 28, 24, 20, 16, 12, 8, 4]
  first_nearest_mean_lifetime_reuse: 38
  run_integrated_schedule:
    q_tokens: 3520
    span_tokens: 3520
    spans: 20
    attention_calls_per_cache_state: 4
    max_compressed_k_tokens: 70400
    interpolation: none
