main_question: "How do long-video KV retention and compression policies affect quality, runtime, and memory over 21 chunks?"

code_tasks:
  - name: add_21_chunk_long_video_benchmark_runner
    goal: "Add benchmark runner for 21-chunk long-video KV cache experiments."
    status: pending

smoke_tests:
  - name: smoke_long_video_benchmark_dry_run
    goal: "Verify benchmark runner prints retention/compression decisions without running full generation."
    constraints:
      - "Do not run full 21-chunk generation."
      - "Do not overwrite existing results."
      - "Must write or validate run_info schema."

formal_experiments:
  - name: full_precision_cpu_offload
    num_chunks: 21
    role: "quality_reference"
    kv_policy: "full_precision"
    cpu_offload: true
    metrics:
      - generation_time_sec
      - peak_gpu_memory_mib
      - vbench

  - name: first_recent_bf16_only
    num_chunks: 21
    kv_policy: "first_recent_only"
    middle_policy: "evict"
    reference: "full_precision_cpu_offload"
    metrics:
      - generation_time_sec
      - kv_compression_ratio
      - psnr
      - ssim
      - lpips
      - vbench

  - name: first_recent_middle_int4
    num_chunks: 21
    kv_policy: "first_recent_middle_compressed"
    middle_policy: "int4 QuantVideo"
    reference: "full_precision_cpu_offload"
    metrics:
      - generation_time_sec
      - compression_time_sec
      - decompression_time_sec
      - kv_compression_ratio
      - psnr
      - ssim
      - lpips
      - vbench

  - name: first_recent_middle_rvq
    num_chunks: 21
    kv_policy: "first_recent_middle_compressed"
    middle_policy: "rvq L8C64 INT4"
    reference: "full_precision_cpu_offload"
    metrics:
      - generation_time_sec
      - compression_time_sec
      - decompression_time_sec
      - kv_compression_ratio
      - psnr
      - ssim
      - lpips
      - vbench

  - name: rvq_21chunk_codebook_retrain_retest
    num_chunks: 21
    status: completed
    goal: "Retrain RVQ codebooks on 21-chunk MovieGenVideoBench KV dumps, then rerun L8/L16/L32 first+recent RVQ long-video benchmarks."
    train_data: "/data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/kv_dump/train"
    test_data: "/data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/kv_dump/test"
    prompt_source: "/home/bowen/QuantVid/external/Self-Forcing/prompts/MovieGenVideoBench.txt"
    split:
      seed: 42
      train_num: 20
      test_num: 10
    codebooks:
      - "L8C64 K/V INT4 runtime storage"
      - "L64C64 K/V INT4 runtime storage, evaluated as L16/L32 prefixes"
    benchmark_config: "experiments/long_video/l8c64_int4_21chunk_retrained.yaml"
    benchmark_run_id: "rvq21_retrained_20260706T062049Z"
    benchmark_settings:
      - full_precision_cpu_offload
      - first_recent_middle_rvq
      - first_recent_middle_rvq_l16c64_int4
      - first_recent_middle_rvq_l32c64_int4
    constraints:
      - "Do not overwrite 11-chunk RVQ codebooks."
      - "Use CPU KV offload during 21-chunk dump and benchmark generation."
      - "Run from watchdog only when at least one configured GPU is idle."

  - name: rvq_21chunk_retrained_10prompt_average
    num_chunks: 21
    status: completed
    goal: "Run the original 10 MovieGenVideoBench test prompts for baseline, native, FP8, and retrained RVQ settings and report averages."
    prompt_file: "/data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/prompts_test.txt"
    prompt_match: "Identical to /data/bowen/t2v_kv_bench_moviegen_20train_10test/prompts_test.txt"
    benchmark_config: "experiments/long_video/l8c64_int4_21chunk_retrained_10prompts.yaml"
    benchmark_run_id: "rvq21_retrained_10prompt_20260706T215403Z"
    summary_csv: "results/long_video/rvq21_retrained_10prompt_20260706T215403Z/summary.csv"
    benchmark_settings:
      - full_precision_cpu_offload
      - first_recent_bf16_only
      - first_recent_middle_int4
      - all_int4
      - all_int2
      - first_recent_middle_fp8
      - first_recent_fp8_only
      - first_recent_middle_rvq
      - first_recent_middle_rvq_l16c64_int4
      - first_recent_middle_rvq_l32c64_int4
    constraints:
      - "Do not overwrite single-prompt results."
      - "Use prompt-sharded watchdog to run on every idle configured GPU."
      - "Report scalar timings and metrics as mean per generated video."

  - name: progressive_rvq_l8_l32c64_int4_21chunk_10prompt
    num_chunks: 21
    status: superseded
    goal: "Run progressive RVQ with per-vector scale, min depth 8, max depth 32, and tuned residual-RMS threshold against the 21-chunk 10-prompt benchmark."
    prompt_file: "/data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/prompts_test.txt"
    benchmark_config: "experiments/long_video/progressive_rvq_l8_l32c64_int4_21chunk_retrained_10prompts.yaml"
    benchmark_run_id: "progressive_rvq_l8_l32c64_10prompt_20260707"
    benchmark_settings:
      - first_recent_middle_rvq_prog_l8_l32c64_int4
    progressive_rvq:
      min_depth: 8
      max_depth: 32
      error_threshold: 0.44638626150589605
      tuning_report: "/data/bowen/t2v_kv_bench_moviegen_20train_10test_21chunk/metrics/progressive_rvq_threshold_l8_l32.json"
      expected_average_depth: 14.013191223144531
      expected_k_average_depth: 8.56530475616455
      expected_v_average_depth: 19.461076736450195
    constraints:
      - "Use per-vector RMS scale."
      - "Do not overwrite existing 21-chunk benchmark outputs."
      - "Start only when at least one configured GPU is idle enough for generation."

  - name: progressive_rvq_l8_l32c64_int4_11chunk_10prompt
    num_chunks: 11
    status: completed
    completed_at: "2026-07-07"
    goal: "Run 11-chunk progressive RVQ with and without first+recent retention, then compare against 11-chunk L8C64 INT4 and L16C64 INT4 rows."
    prompt_file: "/data/bowen/t2v_kv_bench_moviegen_20train_10test/prompts_test.txt"
    benchmark_config: "experiments/long_video/progressive_rvq_l8_l32c64_int4_11chunk_10prompts.yaml"
    benchmark_run_id: "progressive_rvq_l8_l32c64_11chunk_10prompt_20260707"
    benchmark_summary: "results/long_video/progressive_rvq_l8_l32c64_11chunk_10prompt_20260707/summary.csv"
    comparison_ratio_baseline_mib: 24750.0
    benchmark_settings:
      - rvq_l16c64_int4
      - rvq_prog_l8_l32c64_int4
      - first_recent_middle_rvq_l16c64_int4
      - first_recent_middle_rvq_prog_l8_l32c64_int4
    comparison_rows:
      - rvq_l8c64_int4
      - rvq_l16c64_int4
      - rvq_prog_l8_l32c64_int4
      - first_recent_middle_rvq
      - first_recent_middle_rvq_l16c64_int4
      - first_recent_middle_rvq_prog_l8_l32c64_int4
    progressive_rvq:
      min_depth: 8
      max_depth: 32
      error_threshold: 0.4571434633785489
      tuning_report: "/data/bowen/t2v_kv_bench_moviegen_20train_10test/metrics/progressive_rvq_threshold_l8_l32_11chunk.json"
      expected_average_depth: 13.962716102600098
      expected_k_average_depth: 8.63513469696045
      expected_v_average_depth: 19.290298461914062
    constraints:
      - "Use per-vector RMS scale."
      - "Do not overwrite existing 11-chunk benchmark outputs."
      - "Use 80 latent frames as the BF16 KV compression-ratio baseline to match existing 11-chunk metrics."
      - "Start only when at least one configured GPU is idle enough for generation."

report:
  required_metrics:
    - generation_time_sec
    - compression_time_sec
    - decompression_time_sec
    - total_time_sec
    - peak_gpu_memory_mib
    - kv_original_bytes
    - kv_stored_bytes
    - kv_compression_ratio
    - psnr
    - ssim
    - lpips
    - vbench
