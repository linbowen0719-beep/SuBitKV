name: CPU checks

on:
  push:
  pull_request:

jobs:
  repository-and-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "PyYAML>=6" "pytest>=8"
      - name: Validate package and supported configs
        run: |
          python -c "import subitkv"
          python -m compileall -q subitkv scripts
      - name: Run CPU reproduction tests
        run: pytest -q tests/test_repository_hygiene.py tests/test_subitkv.py tests/test_cache_budget.py tests/test_subitkv_schedule.py tests/test_wan_smoke_compat.py tests/test_model_adapters.py tests/test_experiment.py tests/test_memory_accounting.py tests/test_public_commands.py
      - name: Validate complete offline calibration plan
        run: python scripts/calibrate.py
      - name: Validate public workflow for every model
        run: |
          for model in wan2_2_5b self_forcing hyworldplay_8b; do
            for stage in download-models collect calibrate infer metrics; do
              python scripts/run_subitkv.py "$stage" --model "$model"
            done
          done

  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU numerical environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton==3.4.0 pytest PyYAML scipy scikit-learn numpy termcolor loguru einops pyarrow
          python -m pip install -e . --no-deps
      - name: Run complete release tests
        run: python -m pytest -q
