schema_version: 1
name: Self-Forcing INT2 smoke
experiment_id: selfforcing
suite: smoke
model: selfforcing
description: Generate a single 21-frame sample with INT2 KV-cache quantization.
resources:
  gpus: 1
  min_vram_gib: 40
  estimated_time: 10-20 minutes
inputs:
  base_model: ${QVG_CKPT_ROOT}/Self-Forcing/Wan2.1-T2V-1.3B
  checkpoint: ${QVG_CKPT_ROOT}/Self-Forcing/self_forcing_dmd.pt
  prompt_file: ${QVG_REPO_ROOT}/assets/t2v_smoke.txt
required_commands: [torchrun]
required_paths:
  - ${QVG_CKPT_ROOT}/Self-Forcing/Wan2.1-T2V-1.3B
  - ${QVG_CKPT_ROOT}/Self-Forcing/self_forcing_dmd.pt
  - ${QVG_REPO_ROOT}/assets/t2v_smoke.txt
prepare_hint: QVG_CKPT_ROOT="$QVG_CKPT_ROOT" bash scripts/Self-Forcing/download_models.sh
environment:
  PYTHONPATH: ${QVG_REPO_ROOT}/experiments/Self-Forcing:${QVG_REPO_ROOT}
  DUMP_KV_LEVEL: "0"
steps:
  - name: quantized_generation
    command:
      - torchrun
      - --nproc_per_node=1
      - --standalone
      - ${QVG_REPO_ROOT}/experiments/Self-Forcing/inference.py
      - --config_path=${QVG_REPO_ROOT}/experiments/Self-Forcing/configs/self_forcing_dmd.yaml
      - --checkpoint_path=${QVG_CKPT_ROOT}/Self-Forcing/self_forcing_dmd.pt
      - --data_path=${QVG_REPO_ROOT}/assets/t2v_smoke.txt
      - --output_folder=${QVG_RUN_DIR}/qvg
      - --num_samples=1
      - --num_output_frames=21
      - --local_attn_size=21
      - --seed=0
      - --use_ema
      - --save_with_index
      - --quant_type=triton-nstages-kmeans-int2
      - --cache_num_k_centroids=256
      - --cache_num_v_centroids=256
      - --kmeans_max_iters=2
      - --quant_block_size=64
      - --num_prq_stages=1
expected_artifacts:
  - qvg/*.mp4
provenance:
  seed: 0
  prompt_list:
    - assets/t2v_smoke.txt
