# Single public configuration. Paths are relative to the repository root.
schema_version: 1
budgets:
- 0
- 0.2
- 0.5
- 1
- 2
- 3
- 4
runtime:
  root: ${SUBITKV_ROOT:-outputs/subitkv}
  gpus:
  - 0
  device: cuda:0
data:
  train_prompts: assets/moviegen/calibration.txt
  eval_prompts: assets/moviegen/test.txt
  conditioning_images: ${SUBITKV_IMAGES:-data/subitkv/images}
profiles:
  smoke:
    train_count: 2
    eval_count: 1
    eval_prompts: assets/default_prompt.txt
  full:
    train_count: 20
    eval_count: 10
    eval_set: test
  validation:
    train_count: 20
    eval_count: 973
    eval_prompts: assets/moviegen/validation.txt
    eval_set: validation
calibration:
  seed: 42
  levels: 16
  centroids: 64
  sample_size: 90000
  kmeans_iters: 20
  input_norm_mode: none
  assignment_batch_size: 2048
  early_stop:
    threshold: 0.0629
    min_depth: 4
    max_depth: 16
  codebook_storage_dtype: int4
  scale_storage_dtype: uint4
  residual:
    codec_seed: 20260722
    group_size: 128
    scalars_per_head: 256
    fit_scalars: 1000000
    tree_iters: 4
    samples_per_head: 128
    routing_fractions:
    - 0.125
    - 0.25
    - 0.375
  weights:
    queries_per_stream: 4
    seed: 42
  schedule:
    mode: base_aware_dp
    horizon: 10
    # Accounting estimate only; runtime early_stop.max_depth remains independent.
    rvq_base_depth: 8
    # Labels are terminal residual bits per scalar. Total capacity reserves
    # all 10 RVQ bases at rvq_base_depth, then adds this residual budget.
    # At each step subtract the admitted bases (uint8 indices + depth byte)
    # before converting the remaining bytes into residual bit counts.
    budgets:
      '0':
        terminal: 0
      '0.2':
        terminal: 2
      '0.5':
        terminal: 5
      '1':
        terminal: 10
      '2':
        terminal: 20
      '3':
        terminal: 30
      '4':
        terminal: 40
metrics:
  require_complete_memory: true
  enabled:
  - psnr
  - ssim
  - lpips
  - twe
  - vbench
  lpips_network: vgg
  vbench_dimensions:
  - subject_consistency
  - background_consistency
  - temporal_flickering
  - motion_smoothness
  - dynamic_degree
  - aesthetic_quality
  - imaging_quality
  - human_action
  - temporal_style
  - overall_consistency
  twe:
    weights: C_T_V2
    width: 640
    height: 352
    batch_size: 8
    consistency_relative: 0.01
    consistency_absolute: 0.5
    luminance:
    - 0.2126
    - 0.7152
    - 0.0722
models:
  wan2_2_5b:
    layers: 30
    heads: 24
    head_dim: 128
    spatial_tokens: 880
    seed: 42
    frames: 173
    chunks: 11
    chunk_frames: 16
    first_chunk_frames: 13
    steps: 50
    memory_frames: 80
    temporal_context_size: 76
    pred_latent_size: 4
    pose: w-96
    capture_tokens: 3520
    downloads:
    - repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers
      revision: main
      directory: wan_base
    - repo: tencent/HY-WorldPlay
      revision: main
      directory: worldplay
      allow_patterns:
      - wan_transformer/*
      - wan_distilled_model/*
    base: wan_base
    transformer: worldplay/wan_transformer
    checkpoint: worldplay/wan_distilled_model/model.pt
    latent_chunk_frames: 4
    calibration_history_steps: 10
    similarity_exclude_frames: 0
    twe_exclude_frames: 0
  self_forcing:
    layers: 30
    heads: 12
    head_dim: 128
    spatial_tokens: 1560
    seed: 0
    frames: 117
    latent_frames: 30
    chunks: 10
    chunk_frames: 12
    first_chunk_frames: 9
    steps:
    - 1000
    - 750
    - 500
    - 250
    guidance_scale: 3.0
    capture_tokens: 4680
    downloads:
    - repo: Wan-AI/Wan2.1-T2V-1.3B
      revision: main
      directory: Self-Forcing/Wan2.1-T2V-1.3B
    - repo: gdhe17/Self-Forcing
      revision: main
      directory: Self-Forcing
      allow_patterns:
      - checkpoints/self_forcing_dmd.pt
    base: Self-Forcing/Wan2.1-T2V-1.3B
    checkpoint: Self-Forcing/checkpoints/self_forcing_dmd.pt
    latent_chunk_frames: 3
    calibration_history_steps: 9
    similarity_exclude_frames: 9
    twe_exclude_frames: 0
    metrics:
      lpips_network: alex
  hyworldplay_8b:
    layers: 54
    heads: 16
    head_dim: 128
    spatial_tokens: 1537
    seed: 123
    frames: 157
    chunks: 10
    chunk_frames: 16
    first_chunk_frames: 13
    steps: 4
    width: 848
    height: 464
    fps: 24
    pose: w-39
    capture_tokens: 1250
    downloads:
    - repo: tencent/HunyuanVideo-1.5
      revision: main
      directory: HunyuanVideo-1.5
    - repo: tencent/HY-WorldPlay
      revision: main
      directory: worldplay
      allow_patterns:
      - ar_distilled_action_model/*
    base: HunyuanVideo-1.5
    checkpoint: worldplay/ar_distilled_action_model/model.safetensors
    latent_chunk_frames: 4
    calibration_history_steps: 9
    similarity_exclude_frames: 1
    twe_exclude_frames: 1
    metrics:
      lpips_network: vgg
      vbench_dimensions:
      - subject_consistency
      - background_consistency
      - imaging_quality
      - aesthetic_quality
