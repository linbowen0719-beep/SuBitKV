schema_version: 1
experiment_id: paper-main-10prompt
name: Paper main table — Wan2.2 5B and Self-Forcing
description: >-
  Complete 10-prompt closed-loop generation, same-seed BF16 similarity,
  physical KV payload accounting, and VBench-10 for the paper main table.

protocol:
  prompt_file: ${QVG_REPO_ROOT}/assets/paper_main_10prompts.txt
  prompt_sha256: 875762aa06d8a4e15a25e831c4c60bfa2c1b04e70b26362873d01821ad64bc77
  prompt_count: 10
  bf16_kv_cpu_offload: true
  vbench_dimensions:
    - subject_consistency
    - background_consistency
    - temporal_flickering
    - motion_smoothness
    - dynamic_degree
    - aesthetic_quality
    - imaging_quality
    - human_action
    - temporal_style
    - overall_consistency

methods:
  wan2_2_5b:
    - bf16
    - quantvideo_prerope_int4
    - kivi_all_int4
    - turboquant_prod_k4_v4
    - adaptive_temporal_int8_avg4
    - adaptive_temporal_int8_avg3
    - quantvideo_prerope_int2
    - kivi_all_int2
    - turboquant_prod_k2_v2
    - adaptive_temporal_int8_avg2
    - adaptive_temporal_int8_avg1
  self_forcing:
    - bf16
    - quantvideo_prerope_int4
    - kivi_all_int4
    - turboquant_prod_k4_v4
    - adaptive_temporal_avg4
    - adaptive_temporal_avg3
    - quantvideo_prerope_int2
    - kivi_all_int2
    - turboquant_prod_k2_v2
    - adaptive_temporal_avg2
    - adaptive_temporal_avg1

rvq_training:
  prompt_file: ${QVG_REPO_ROOT}/assets/moviegen_train20.txt
  prompt_sha256: e7a4ad6f324a3671b4205f8c2c9ff3c487370d8ea7089836556ec4b3b3b6cdc0
  prompt_count: 20
  levels: 16
  centroids: 64
  input_norm_mode: none
  sample_size: 90000
  kmeans_max_iters: 20
  models:
    wan2_2_5b: {layers: 30, heads: 24}
    self_forcing: {layers: 30, heads: 12}

models:
  wan2_2_5b:
    seed: 42
    resources: 1 GPU per job; validated on RTX 6000 Ada 48 GiB
    checkpoint_root: ${QVG_CKPT_ROOT}/HY-WorldPlay
    output_root: ${QVG_OUTPUT_ROOT}/paper-main-10prompt/wan2_2_5b
  self_forcing:
    seed: 0
    resources: 1 GPU per job; validated on RTX 6000 Ada 48 GiB
    base_model: ${QVG_CKPT_ROOT}/Self-Forcing/Wan2.1-T2V-1.3B
    checkpoint: ${QVG_CKPT_ROOT}/Self-Forcing/self_forcing_dmd.pt
    output_root: ${QVG_OUTPUT_ROOT}/paper-main-10prompt/self_forcing

