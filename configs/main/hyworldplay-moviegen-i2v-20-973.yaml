schema_version: 1
experiment_id: hyworldplay-moviegen-i2v-20-973
name: HY-WorldPlay 8B MovieGen I2V 20-train / 10-dev / 973-test

protocol:
  prompt_file: ${SUBITKV_REPO_ROOT}/assets/MovieGenVideoBench.txt
  split_file: ${SUBITKV_REPO_ROOT}/assets/moviegen_i2v_split_v1.json
  moviegen_root: ${SUBITKV_MOVIEGEN_ROOT}
  train_count: 20
  dev_count: 10
  test_count: 973
  duplicate_prompt_pairs_in_test: 5
  split_identity: dataset_row
  conditioning_frame: 0
  seed: 123
  frames: 157
  compared_frames: 156
  width: 848
  height: 464
  fps: 24
  inference_steps: 4
  dtype: bf16
  full_history_attention: true
  append_only_vision_cache: true
  kv_cpu_offload: true
  text_encoder_offload_after_encode: true
  terminal_cache_audit_excluded_from_e2e: true

methods:
  - bf16
  - ours_rvq_avg1
  - ours_rvq_avg2
  - ours_rvq_avg3
  - ours_rvq_avg4
  - ours_rvq_avg0
  - ours_rvq_avg0p2_alt
  - ours_rvq_avg0p5
  - kivi_int2
  - kivi_int4
  - turboquant_int2
  - turboquant_int4
  - quantvideo_int2
  - quantvideo_int4

training:
  capture_positions_per_prompt_layer: 1250
  append_spans: 10
  attention_streams: [rope, prope]
  vectors_per_head: 50000
  layers: 54
  heads: 16
  head_dim: 128
  levels: 16
  centroids: 64
  input_norm_mode: none
  kmeans_iterations: 20
  seed: 42
  early_stop:
    threshold: 0.0629
    min_depth: 4
    max_depth: 16
  temporal_capacities:
    ours_rvq_avg1: 10
    ours_rvq_avg2: 20
    ours_rvq_avg3: 30
    ours_rvq_avg4: 40

evaluation:
  reference: bf16_same_input_same_seed
  exclude_conditioning_frames: 1
  psnr: per_frame_rgb_db_then_mean
  ssim: rgb_11x11
  lpips: vgg_minus1_to_1
  vbench_dimensions:
    - subject_consistency
    - background_consistency
    - imaging_quality
    - aesthetic_quality

paths:
  model: ${SUBITKV_HY8B_MODEL}
  action_checkpoint: ${SUBITKV_HY_ACTION_CKPT}
  manifest: ${SUBITKV_DATA_ROOT}/hyworldplay-moviegen-i2v-20-973/artifacts/inputs/manifest.json
  run_root: ${SUBITKV_OUTPUT_ROOT}/hyworldplay-moviegen-i2v-20-973
  artifact_root: ${SUBITKV_DATA_ROOT}/hyworldplay-moviegen-i2v-20-973/artifacts

gate:
  split: dev
  required_methods: 14
  ours_psnr_min: 25.0
  ours_ssim_min: 0.80
  ours_lpips_max: 0.25
